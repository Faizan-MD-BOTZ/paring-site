<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAIZAN-MD SESSION</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #1a1a2e;
            --secondary-color: #16213e;
            --accent-color: #0f3460;
            --text-color: #f1f1f1;
            --gradient-primary: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --gradient-secondary: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            --success-color: #4ade80;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .container {
            width: 100%;
            max-width: 450px;
            background: rgba(26, 26, 46, 0.9);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            background: var(--gradient-primary);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: white;
        }

        .title {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 8px;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .subtitle {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 25px;
        }

        .social-icons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .social-icons a {
            width: 46px;
            height: 46px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 18px;
            text-decoration: none;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s;
        }

        .social-icons a:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        .social-icons a.youtube {
            color: #ff0000;
        }
        .social-icons a.facebook {
            color: #0088cc;
        }
        .social-icons a.whatsapp {
            color: #25D366;
        }
        .social-icons a.github {
            color: #ffffff;
        }

        .toggle-container {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 25px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 4px;
        }

        .toggle-option {
            flex: 1;
            padding: 14px 20px;
            text-align: center;
            cursor: pointer;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.5);
        }

        .toggle-option.active {
            background: var(--gradient-primary);
            color: white;
        }

        .toggle-option i {
            margin-right: 8px;
        }

        .input-group {
            margin-bottom: 25px;
        }

        .input-group.hidden {
            display: none;
        }

        .input-label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.8);
        }

        .input-field {
            width: 100%;
            padding: 16px 20px;
            border: 1.5px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.03);
            color: var(--text-color);
            font-size: 15px;
        }

        .input-field:focus {
            outline: none;
            border-color: rgba(102, 126, 234, 0.5);
        }

        .generate-btn {
            width: 100%;
            padding: 18px;
            background: var(--gradient-primary);
            border: none;
            border-radius: 16px;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 20px;
        }

        .generate-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.4);
        }

        .generate-btn.hidden {
            display: none;
        }

        .code-display {
            background: rgba(255, 255, 255, 0.03);
            padding: 20px;
            border-radius: 16px;
            text-align: center;
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 20px;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1.5px solid rgba(255, 255, 255, 0.1);
            color: var(--success-color);
        }

        .qr-display {
            background: rgba(255, 255, 255, 0.03);
            padding: 30px;
            border-radius: 16px;
            text-align: center;
            margin-bottom: 20px;
            border: 1.5px solid rgba(255, 255, 255, 0.1);
            display: none;
        }

        .qr-image {
            max-width: 280px;
            max-height: 280px;
            margin: 0 auto 20px;
            border-radius: 16px;
            background: white;
            padding: 15px;
        }

        .qr-instructions {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
            line-height: 1.6;
        }

        .copy-btn {
            width: 100%;
            padding: 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1.5px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: rgba(255, 255, 255, 0.8);
            transition: all 0.3s;
            margin-top: 20px;
        }

        .copy-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .loading {
            display: none;
            text-align: center;
            margin: 20px 0;
        }

        .loading i {
            font-size: 28px;
            color: #667eea;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.4);
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo"><i class="fas fa-robot"></i></div>
            <h1 class="title">FAIZAN-MD</h1>
            <p class="subtitle">Link your WhatsApp device</p>
            <div class="social-icons">
                <a href="https://youtube.com/@faizu_jutt1" target="_blank" class="youtube">
                    <i class="fab fa-youtube"></i>
                </a>
                <a href="https://facebook.com/fazii7800" target="_blank" class="facebook">
                    <i class="fab fa-facebook"></i>
                </a>
                <a href="https://wa.me/923266105873" target="_blank" class="whatsapp">
                    <i class="fab fa-whatsapp"></i>
                </a>
                <a href="https://github.com/Faizan-MD-BOTZ" target="_blank" class="github">
                    <i class="fab fa-github"></i>
                </a>
            </div>
        </div>

        <div class="toggle-container">
            <div class="toggle-option active" data-mode="pair">
                <i class="fas fa-key"></i> Pair Code
            </div>
            <div class="toggle-option" data-mode="qr">
                <i class="fas fa-qrcode"></i> QR Code
            </div>
        </div>

        <div class="input-group" id="inputGroup">
            <label class="input-label">Enter your WhatsApp number</label>
            <input type="text" id="mobileNumber" class="input-field" placeholder="+923266105873">
        </div>

        <button class="generate-btn" id="submit">
            <i class="fas fa-key"></i> Generate Pair Code
        </button>

        <div class="loading" id="loading">
            <i class="fas fa-spinner"></i>
        </div>

        <div class="code-display" id="codeDisplay">
            Your pair code will appear here
        </div>

        <div class="qr-display" id="qrDisplay">
            <img id="qrImage" class="qr-image" src="" alt="QR Code">
            <div class="qr-instructions" id="qrInstructions">
                Scan this QR code with your WhatsApp app
            </div>
        </div>

        <button class="copy-btn" id="copy">
            <i class="fas fa-copy"></i> Copy Code
        </button>

        <div class="footer">
            <p>© 2026 FAIZAN-MD⁸⁷³. All rights reserved.</p>
        </div>
    </div>

    <script>
        let currentMode = "pair";

        // Toggle functionality
        document.querySelectorAll(".toggle-option").forEach((option) => {
            option.addEventListener("click", function () {
                const mode = this.dataset.mode;
                if (mode === currentMode) return;

                // Update active state
                document.querySelectorAll(".toggle-option").forEach((opt) => opt.classList.remove("active"));
                this.classList.add("active");

                // Update mode
                currentMode = mode;

                // Update button and input visibility
                const submitBtn = document.getElementById("submit");
                const inputGroup = document.getElementById("inputGroup");

                if (mode === "pair") {
                    submitBtn.innerHTML = '<i class="fas fa-key"></i> Generate Pair Code';
                    submitBtn.classList.remove("hidden");
                    inputGroup.classList.remove("hidden");
                } else {
                    submitBtn.classList.add("hidden");
                    inputGroup.classList.add("hidden");
                    generateQRCode();
                }

                // Clear displays
                document.getElementById("codeDisplay").innerHTML = "Your pair code will appear here";
                document.getElementById("qrDisplay").style.display = "none";
                document.getElementById("codeDisplay").style.display = "flex";
            });
        });

        function generateQRCode() {
            const codeDisplay = document.getElementById("codeDisplay");
            const qrDisplay = document.getElementById("qrDisplay");
            const loadingSpinner = document.getElementById("loading");

            loadingSpinner.style.display = "block";
            codeDisplay.innerHTML = "";
            qrDisplay.style.display = "none";

            // Simulate API call
            setTimeout(() => {
                document.getElementById("qrImage").src = "https://api.qrserver.com/v1/create-qr-code/?size=280x280&data=https://whatsapp.com/channel/0029VbBmz4V5vKAIaWfYPT0C";
                document.getElementById("qrInstructions").innerHTML = 
                    "1. Open WhatsApp on your phone<br>" +
                    "2. Tap Menu → Linked Devices<br>" +
                    "3. Tap Link a Device<br>" +
                    "4. Point your phone at this QR code";
                
                qrDisplay.style.display = "block";
                codeDisplay.style.display = "none";
                loadingSpinner.style.display = "none";
            }, 1500);
        }

        document.getElementById("submit").addEventListener("click", function(e) {
            e.preventDefault();

            const mobileNumberInput = document.getElementById("mobileNumber");
            const codeDisplay = document.getElementById("codeDisplay");
            const qrDisplay = document.getElementById("qrDisplay");
            const loadingSpinner = document.getElementById("loading");

            const mobileNumber = mobileNumberInput.value.trim();
            if (!mobileNumber) {
                codeDisplay.innerHTML = '<div style="color:#ff6b6b;"><i class="fas fa-exclamation-circle"></i> Please enter your WhatsApp number</div>';
                return;
            }

            loadingSpinner.style.display = "block";
            codeDisplay.innerHTML = "";
            qrDisplay.style.display = "none";

            // Simulate API call
            setTimeout(() => {
                // Generate random 6-digit code
                const randomCode = Math.floor(100000 + Math.random() * 900000);
                
                codeDisplay.innerHTML = `<div style="color:#4ade80;">
                    <i class="fas fa-check-circle"></i> Pair Code: <strong>${randomCode}</strong>
                </div>`;
                codeDisplay.style.display = "flex";
                qrDisplay.style.display = "none";
                loadingSpinner.style.display = "none";
                
                // Show instructions
                setTimeout(() => {
                    alert(`✅ Pair Code Generated!\n\nCode: ${randomCode}\n\nInstructions:\n1. Open WhatsApp on your phone\n2. Go to Settings → Linked Devices\n3. Tap Link a Device\n4. Enter this code: ${randomCode}`);
                }, 500);
                
            }, 2000);
        });

        document.getElementById("copy").addEventListener("click", function() {
            const codeElement = document.querySelector('.code-display strong');
            if (codeElement) {
                const code = codeElement.textContent;
                navigator.clipboard.writeText(code).then(() => {
                    const copyBtn = document.getElementById('copy');
                    const originalHTML = copyBtn.innerHTML;
                    copyBtn.innerHTML = '<i class="fas fa-check"></i> Copied!';
                    copyBtn.style.background = '#4ade80';
                    
                    setTimeout(() => {
                        copyBtn.innerHTML = originalHTML;
                        copyBtn.style.background = '';
                    }, 2000);
                });
            } else {
                alert('Please generate a code first!');
            }
        });

        // Auto-focus on input field
        document.getElementById('mobileNumber').focus();
    </script>
</body>
</html>
