<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>𝐅αɪᴢαɴ-𝐌ᴅ⎯ | Pair Code</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.4.0/axios.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: linear-gradient(160deg, #06061a 0%, #0a0a1f 50%, #0d0d24 100%);
      font-family: 'Inter', sans-serif;
      color: #f0f0ff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem 1rem;
    }

    /* Glow background */
    body::before {
      content: '';
      position: fixed;
      top: -100px; left: 50%;
      transform: translateX(-50%);
      width: 600px; height: 600px;
      background: radial-gradient(ellipse, rgba(109,40,217,0.18) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.2rem;
    }

    /* ---------- Header / Logo ---------- */
    .header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.6rem;
      padding-top: 0.5rem;
    }

    .logo-wrap {
      position: relative;
      width: 90px; height: 90px;
    }

    .logo-wrap::before {
      content: '';
      position: absolute;
      inset: -12px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(139,92,246,0.35) 0%, transparent 70%);
      animation: glow-pulse 3s ease-in-out infinite;
    }

    @keyframes glow-pulse {
      0%, 100% { opacity: 0.5; transform: scale(1); }
      50%       { opacity: 1;   transform: scale(1.1); }
    }

    .logo-inner {
      width: 90px; height: 90px;
      border-radius: 50%;
      background: linear-gradient(135deg, #6d28d9, #8b5cf6, #3b82f6);
      display: flex; align-items: center; justify-content: center;
      font-size: 2.5rem;
      box-shadow: 0 0 30px rgba(139,92,246,0.4);
    }

    .bot-name {
      font-size: 1.9rem;
      font-weight: 800;
      letter-spacing: 3px;
      text-transform: uppercase;
      background: linear-gradient(135deg, #8b5cf6, #a78bfa, #3b82f6);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .bot-sub {
      font-size: 0.85rem;
      color: rgba(240,240,255,0.5);
      letter-spacing: 0.5px;
    }

    /* ---------- Social Icons Row ---------- */
    .social-row {
      display: flex;
      gap: 0.7rem;
      justify-content: center;
    }

    .social-tile {
      width: 48px; height: 48px;
      border-radius: 12px;
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.08);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.2rem;
      text-decoration: none;
      transition: transform 0.2s, background 0.2s;
    }

    .social-tile:hover {
      transform: translateY(-3px);
      background: rgba(255,255,255,0.1);
    }

    .social-tile.yt  { color: #ff0000; }
    .social-tile.fb  { color: #1877f2; }
    .social-tile.wa  { color: #25d366; }
    .social-tile.gh  { color: #f0f0ff; }

    /* ---------- Card ---------- */
    .card {
      width: 100%;
      background: rgba(255,255,255,0.04);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      padding: 1.6rem;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    /* ---------- Toggle ---------- */
    .toggle-wrap {
      display: flex;
      background: rgba(255,255,255,0.05);
      border-radius: 12px;
      padding: 4px;
      gap: 4px;
    }

    .toggle-btn {
      flex: 1;
      padding: 0.6rem;
      border: none;
      border-radius: 9px;
      font-family: 'Inter', sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s;
      background: transparent;
      color: rgba(240,240,255,0.45);
    }

    .toggle-btn.active {
      background: linear-gradient(135deg, #6d28d9, #8b5cf6, #3b82f6);
      color: #fff;
      box-shadow: 0 2px 12px rgba(139,92,246,0.4);
    }

    /* ---------- Input ---------- */
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .input-label {
      font-size: 0.8rem;
      color: rgba(240,240,255,0.5);
      letter-spacing: 0.5px;
    }

    .input-field {
      width: 100%;
      padding: 0.85rem 1rem;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      color: #f0f0ff;
      font-family: 'Inter', sans-serif;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .input-field::placeholder { color: rgba(240,240,255,0.25); }

    .input-field:focus {
      border-color: rgba(139,92,246,0.5);
      box-shadow: 0 0 0 3px rgba(139,92,246,0.1);
    }

    /* ---------- Generate Button ---------- */
    .gen-btn {
      width: 100%;
      padding: 0.9rem;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #6d28d9, #8b5cf6, #3b82f6);
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      gap: 0.5rem;
      transition: opacity 0.2s, transform 0.15s;
      box-shadow: 0 4px 20px rgba(139,92,246,0.35);
    }

    .gen-btn:hover:not(:disabled) { opacity: 0.9; transform: translateY(-1px); }
    .gen-btn:disabled { opacity: 0.6; cursor: not-allowed; }

    /* ---------- Code Display ---------- */
    .code-area {
      min-height: 64px;
      display: flex; align-items: center; justify-content: center;
    }

    .code-box {
      width: 100%;
      background: rgba(0,0,0,0.35);
      border: 1px solid rgba(0,255,136,0.2);
      border-radius: 12px;
      padding: 1.1rem 1.2rem;
      cursor: pointer;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .code-box:hover {
      border-color: rgba(0,255,136,0.45);
      box-shadow: 0 0 12px rgba(0,255,136,0.1);
    }

    .code-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: rgba(0,255,136,0.5);
      margin-bottom: 0.4rem;
      letter-spacing: 1px;
    }

    .code-value {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.3rem;
      font-weight: 700;
      color: #00ff88;
      letter-spacing: 4px;
      word-break: break-all;
    }

    .code-hint {
      font-size: 0.72rem;
      color: rgba(240,240,255,0.3);
      margin-top: 0.3rem;
    }

    .error-box {
      width: 100%;
      background: rgba(239,68,68,0.08);
      border: 1px solid rgba(239,68,68,0.25);
      border-radius: 12px;
      padding: 0.9rem 1.1rem;
      color: #fca5a5;
      font-size: 0.85rem;
      display: flex; align-items: center; gap: 0.5rem;
    }

    .placeholder-text {
      color: rgba(240,240,255,0.2);
      font-size: 0.85rem;
    }

    /* ---------- Copy Button ---------- */
    .copy-btn {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      background: rgba(255,255,255,0.04);
      color: rgba(240,240,255,0.7);
      font-family: 'Inter', sans-serif;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      gap: 0.5rem;
      transition: all 0.2s;
    }

    .copy-btn:hover {
      background: rgba(139,92,246,0.1);
      border-color: rgba(139,92,246,0.3);
      color: #a78bfa;
    }

    .copy-btn:disabled { opacity: 0.3; cursor: default; }

    /* ---------- Footer ---------- */
    .footer {
      font-size: 0.75rem;
      color: rgba(240,240,255,0.2);
      text-align: center;
    }

    .footer a { color: rgba(139,92,246,0.6); text-decoration: none; }
    .footer a:hover { color: #8b5cf6; }

    /* ---------- Spinner ---------- */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spin { display: inline-block; animation: spin 0.8s linear infinite; }

    /* ---------- QR panel (hidden by default) ---------- */
    #qr-panel { display: none; text-align: center; }
    #qr-panel .coming { color: rgba(240,240,255,0.35); font-size: 0.9rem; margin-top: 0.5rem; }
  </style>
</head>
<body>
<div class="container">

  <!-- Header -->
  <div class="header">
    <div class="logo-wrap">
      <div class="logo-inner">🤖</div>
    </div>
    <div class="bot-name">𝐅αɪᴢαɴ-𝐌ᴅ</div>
    <div class="bot-sub">Link your WhatsApp device</div>
  </div>

  <!-- Social Row -->
  <div class="social-row">
    <a href="https://youtube.com/@FaizanMD" target="_blank" class="social-tile yt"><i class="fab fa-youtube"></i></a>
    <a href="https://facebook.com" target="_blank" class="social-tile fb"><i class="fab fa-facebook-f"></i></a>
    <a href="https://whatsapp.com" target="_blank" class="social-tile wa"><i class="fab fa-whatsapp"></i></a>
    <a href="https://github.com/Faizan-MD-BOTZ" target="_blank" class="social-tile gh"><i class="fab fa-github"></i></a>
  </div>

  <!-- Main Card -->
  <div class="card">

    <!-- Toggle -->
    <div class="toggle-wrap">
      <button class="toggle-btn active" id="btn-pair" onclick="switchMode('pair')">
        <i class="fas fa-key"></i>&nbsp; Pair Code
      </button>
      <button class="toggle-btn" id="btn-qr" onclick="switchMode('qr')">
        <i class="fas fa-qrcode"></i>&nbsp; QR Code
      </button>
    </div>

    <!-- Pair Panel -->
    <div id="pair-panel">
      <div class="input-group">
        <div class="input-label">Phone Number (with country code)</div>
        <input type="tel" id="number" class="input-field" placeholder="+923XXXXXXXXX" autocomplete="off">
      </div>

      <button class="gen-btn" id="submit">
        <i class="fas fa-key"></i> Generate Pair Code
      </button>

      <div class="code-area" id="pair">
        <span class="placeholder-text"><i class="fas fa-lock"></i>&nbsp; Your code will appear here</span>
      </div>

      <button class="copy-btn" id="copyBtn" disabled onclick="Copy()">
        <i class="fas fa-copy"></i> Copy Code
      </button>
    </div>

    <!-- QR Panel -->
    <div id="qr-panel">
      <i class="fas fa-qrcode" style="font-size:3rem;color:rgba(139,92,246,0.4);"></i>
      <p class="coming">QR Code feature — go to <a href="/">home page</a></p>
    </div>

  </div>

  <!-- Footer -->
  <div class="footer">
    © 2025 <a href="https://github.com/Faizan-MD-BOTZ">Faizan-MD</a> · All rights reserved
  </div>

</div>

<script>
  let currentCode = "";

  function switchMode(mode) {
    const pairPanel = document.getElementById("pair-panel");
    const qrPanel   = document.getElementById("qr-panel");
    const btnPair   = document.getElementById("btn-pair");
    const btnQr     = document.getElementById("btn-qr");

    if (mode === "pair") {
      pairPanel.style.display = "";
      qrPanel.style.display   = "none";
      btnPair.classList.add("active");
      btnQr.classList.remove("active");
    } else {
      pairPanel.style.display = "none";
      qrPanel.style.display   = "";
      btnQr.classList.add("active");
      btnPair.classList.remove("active");
    }
  }

  async function Copy() {
    if (!currentCode) return;
    try {
      await navigator.clipboard.writeText(currentCode);
      const btn = document.getElementById("copyBtn");
      const orig = btn.innerHTML;
      btn.innerHTML = '<i class="fas fa-check"></i> Copied!';
      btn.style.color = "#00ff88";
      btn.style.borderColor = "rgba(0,255,136,0.3)";
      setTimeout(() => {
        btn.innerHTML = orig;
        btn.style.color = "";
        btn.style.borderColor = "";
      }, 1800);
    } catch(e) {}
  }

  document.getElementById("submit").addEventListener("click", async (e) => {
    e.preventDefault();
    const input = document.getElementById("number");
    const pairDiv = document.getElementById("pair");
    const copyBtn = document.getElementById("copyBtn");
    const submitBtn = document.getElementById("submit");

    if (!input.value) {
      pairDiv.innerHTML = '<div class="error-box"><i class="fas fa-exclamation-triangle"></i> Please enter your number</div>';
      return;
    }

    const Nick = input.value.replace(/[^0-9]/g, "");
    if (Nick.length < 11) {
      pairDiv.innerHTML = '<div class="error-box"><i class="fas fa-exclamation-triangle"></i> Invalid number — include country code</div>';
      return;
    }

    // Format input display
    let bb = "", bbc = "";
    Nick.split("").forEach(ch => {
      bbc += ch;
      if (bbc.length === 3 || bbc.length === 8) bb += " " + ch;
      else bb += ch;
    });
    input.type = "text";
    input.value = "+" + bb;
    input.style.color = "#a78bfa";

    submitBtn.disabled = true;
    submitBtn.innerHTML = '<i class="fas fa-spinner spin"></i>&nbsp; Generating...';
    copyBtn.disabled = true;
    currentCode = "";

    pairDiv.innerHTML = '<span class="placeholder-text"><i class="fas fa-spinner spin"></i>&nbsp; Please wait...</span>';

    try {
      const { data } = await axios("/code?number=" + Nick);
      const code = data.code || "Service Unavailable";
      currentCode = code;

      pairDiv.innerHTML = `
        <div class="code-box" id="codeBox" onclick="Copy()">
          <div class="code-label">YOUR PAIR CODE</div>
          <div class="code-value">${code}</div>
          <div class="code-hint"><i class="fas fa-copy"></i>&nbsp; Tap to copy</div>
        </div>`;
      copyBtn.disabled = false;
    } catch (err) {
      pairDiv.innerHTML = '<div class="error-box"><i class="fas fa-exclamation-triangle"></i> Service Unavailable — Try Again</div>';
    } finally {
      submitBtn.disabled = false;
      submitBtn.innerHTML = '<i class="fas fa-key"></i> Generate Pair Code';
    }
  });
</script>
</body>
</html>
